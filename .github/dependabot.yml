# Dependabot 設定: 依存関係の既知脆弱性・更新を毎週チェックして PR を作成する
# (CLAUDE.md §9「依存（サプライチェーン）を管理する」に基づく)
#
# サイト本体は手書きの静的 HTML/CSS/JS で実行時依存を持たない。ここで監視するのは
# 検証・テスト用の開発ツール (html-validate / Playwright / Lighthouse CI) と CI の
# GitHub Actions のみ。
version: 2
updates:
  # package.json / package-lock.json の npm 開発依存 (Playwright / LHCI 等)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # コミット規約 type(scope) に合わせる (§12)
      prefix: "chore(deps)"
    groups:
      # minor / patch 更新は 1 本の PR にまとめてレビュー負荷を下げる (major は個別 PR)
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  # .github/workflows/ で使う GitHub Actions (ci / lighthouse / update-snapshots 等)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # コミット規約 type(scope) に合わせる (§12)
      prefix: "chore(ci)"
