name: CI

on:
  pull_request:
  push:
    branches: [main]

# ワークフローレベルの permissions は設定せず、各ジョブで最小権限を個別に指定する。
# visual-regression ジョブはスナップショット自動コミットのため contents: write が必要。

jobs:
  html-validate:
    runs-on: ubuntu-latest
    # HTML バリデーションはリポジトリの読み取りのみ必要
    permissions:
      contents: read
    steps:
      # Third-party actions are pinned to a commit SHA (not a mutable tag) for
      # supply-chain integrity (issue #16); the version is noted in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Validate HTML
        run: npx --yes html-validate "index.html" "resume.html"

  link-check:
    runs-on: ubuntu-latest
    # リンクチェックはリポジトリの読み取りのみ必要
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >
            --verbose
            --no-progress
            --accept 200,201,202,203,204,206,301,302,303,307,308,429
            --timeout 20
            --max-retries 3
            .

  visual-regression:
    runs-on: ubuntu-latest
    # スナップショットが存在しない場合にベースラインを自動コミットするため write が必要
    permissions:
      contents: write
    env:
      # Playwright のベースライン画像が置かれるディレクトリ。
      # env に置く主な理由は、下に書く update-portfolio-data.yml との取り決めを
      # 値のすぐ隣に残すため（使う箇所自体は多くない）。
      # 参照側で "${SNAPSHOT_DIR%/}/" と正規化するので、末尾の / の有無は問わない。
      # spec ごとに <spec 名>-snapshots/ が作られるため、2 本目の spec が
      # スクリーンショットを撮るようになったらここを見直す。
      # このパスは update-portfolio-data.yml の MERGEABLE_EXTRA_PATHS の内側に
      # 収まっている必要がある（自動コミット先の更新ブランチは日次データ更新 PR の
      # head でもあり、許可リストに無いパスが載るとその日の更新が止まるため）。
      # したがって、狭める分には単独で変えてよく、広げるときだけ許可リスト側も併せて広げる。
      # ワークフローレベルでなくジョブレベルに置くのは、使うのがこのジョブだけであり
      # 他ジョブの全ステップへ渡す必要がないため（§9 最小公開）。
      SNAPSHOT_DIR: e2e/visual.spec.ts-snapshots/
      # 以下 2 つの「値」は .gitignore にも書いてある（ディレクトリ側は末尾 / 付き）。
      # あちらは変数を使えないため、値を変えるときは .gitignore も必ず併せて直すこと
      # （変数名だけを変えるなら .gitignore は関係ない）。
      # 再実行の出力先。既定の test-results/ と分けて 1 回目の証跡を守る。
      # 書き出し（--output）・アーティファクトの path・冒頭の検査ステップで使う（§6 一元管理）。
      RECHECK_OUTPUT_DIR: test-results-recheck
      # 自動コミットの対象外だった未追跡ファイルの一覧を書き出す先。
      # 書き出し・警告文・アーティファクトの path・冒頭の検査ステップで使う（同上）。
      UNTRACKED_LIST_FILE: untracked-snapshot-files.txt
    steps:
      # head_ref（PR ブランチ名）を明示して checkout することで、
      # デタッチ HEAD でなくブランチとして取得し git push を可能にする
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # 浅いクローン（shallow clone）だと git push が "shallow update not allowed" で失敗するため
          # 完全な履歴を取得して push を確実に成功させる
          fetch-depth: 0

      - name: 下のステップが使う env を検査
        # 何を見るか: run に列挙した env について、定義漏れ・空だけ。
        # env: の網羅チェックではない。参照側の書き間違いも分からず、とくに
        # アーティファクトの ${{ env.… }} が旧名のまま残った場合は、この検査を
        # 通り抜ける（未定義でも空文字に展開されるだけで、actionlint も検出しない）。
        #
        # なぜ無条件のステップにするか: この検査を条件付きのステップ
        # （自動コミット・再実行）の中に置くと、スナップショット差分が無い通常の PR では
        # どちらも skip されて一度も走らず、定義が消えたまま緑で main に入るため。
        #
        # 実装: :? は最初に見つかった 1 つで打ち切るので、複数欠けていれば 1 回に 1 つずつ出る。
        #
        # 変更するとき: このジョブのステップが使う env は、参照の書き方によらずここへ足す
        # （条件付きステップの中でしか参照しない env は、その日が来るまで
        #   定義漏れに気づけない。足し忘れても検査は緑のまま通る）。
        # 名前を変えるときは $VAR と ${{ env.… }} の両方を検索する
        # （.gitignore については上の env のコメントを参照）。
        run: |
          # 未定義変数・コマンド失敗・パイプ失敗を即時エラーとして検出する
          set -euo pipefail
          # ${VAR:?} は「未定義または空なら、そこで打ち切る」書き方。
          # 先頭の : は「何もしない」コマンドで、検査だけを目的に置いている
          : "${SNAPSHOT_DIR:?}" "${RECHECK_OUTPUT_DIR:?}" "${UNTRACKED_LIST_FILE:?}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        # ベースラインが存在しない場合に失敗しても後続ステップでリカバリするため continue-on-error を使う
        id: playwright
        run: npm run test:e2e
        continue-on-error: true

      - name: スナップショットが存在しなかった場合のみベースラインを自動コミット
        # ベースラインが無くて新規生成された PNG（未追跡ファイル）があれば自動コミットする。
        # 既存スナップショットとの差分（ビジュアルリグレッション）の場合は自動コミットしない。
        # フォーク PR からの push は GITHUB_TOKEN 権限が制限され、かつスナップショットは
        # ベースブランチ側に自動コミットすべきでないためフォーク PR を除外する
        # main への直 push ではスナップショットを自動コミットしない
        # (auto-commit がレビューをバイパスして main に混入するのを防ぐ)
        if: >
          steps.playwright.outcome == 'failure' &&
          github.ref != 'refs/heads/main' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        id: autocommit
        run: |
          # 未定義変数・コマンド失敗・パイプ失敗を即時エラーとして検出する（セキュリティ上の best practice）
          set -euo pipefail
          # 未追跡の PNG = スナップショットが存在しなかったため新規生成されたファイル。
          # 一覧は NULL 区切りのままファイルへ受け、シェル変数を経由させない。
          # 変数に入れて `printf '%s\0' $NEW` のように展開すると、NULL 区切りにする前に
          # シェルが空白で単語分割してしまい、"my snap.png" が 2 つの引数に割れる
          # （空白を含む名前も安全に扱う、という当初の意図が果たせていなかった）。
          # 一覧を受け取る一時ファイルを作る
          new_snapshots="$(mktemp)"
          # ステップ終了時に一時ファイルを消す（失敗して途中で抜けても残さない）
          trap 'rm -f "$new_snapshots"' EXIT
          # 対象ディレクトリは SNAPSHOT_DIR（このジョブの env で 1 か所定義）。
          # ${SNAPSHOT_DIR%/} は「末尾に / があれば取り除く」書き方。そのうえで / を足すため、
          # env 側が末尾 / を付け忘れても pathspec が兄弟ディレクトリへ広がらない
          # （末尾 / が無いと e2e/...-snapshots*.png となり -snapshots-old/ 等にも当たる）。
          snapshot_dir="${SNAPSHOT_DIR%/}/"
          # 拡張子まで絞る。ディレクトリ指定のままだと、中断した実行が残した一時ファイル等
          # PNG 以外の未追跡ファイルまで「ベースライン自動生成」という件名でコミットされる。
          # そのパスは MERGEABLE_EXTRA_PATHS のディレクトリ前方一致にも該当するため、
          # 日次データ更新 PR の許可判定も素通りしてしまう。ここで絞るのは
          # 「この自動コミットが PNG 以外を持ち込まない」ことの保証であり、
          # 許可リスト側は前方一致のままなので、別経路で置かれたファイルまでは防げない
          # （許可リストがパターンを書けるようになるまでの、入口側の一次防御）。
          # * はダブルクォートの中ではシェルに展開されず、git へそのまま渡って
          # git 側のパターンとして解釈される（意図どおり）。
          git ls-files -z --others --exclude-standard -- "${snapshot_dir}*.png" > "$new_snapshots"

          # 自動コミットの対象外になる未追跡ファイル（＝PNG 以外）の件数を数える。
          # これは PNG が 1 枚でも生成されたかどうかとは独立した事実なので、
          # コミット処理より前に、かつ if の外で報告する。
          # コミットの中で報告すると、新規 PNG と PNG 以外が同時に出た日や
          # push に失敗した日に、取りこぼしを誰にも知らせないまま終わってしまう。
          # 数え方は「ディレクトリ全体の未追跡数 − 上で拾った PNG 数」。
          # ":(exclude)" で PNG を除いた一覧を別に引くこともできるが、それだと
          # 上の pathspec と常に正確な裏返しであり続ける必要があり、片方だけ直すと
          # どちらにも入らないファイルが生まれる（＝黙って消える）。引き算なら
          # 参照する pathspec が 1 つで済み、そのずれ自体が起こらない。
          # git の実行結果はいったん変数へ受ける。if の条件式の中で "$(...)" を書くと、
          # git 自体が失敗しても「出力が空」に見えるだけで set -e が働かず、
          # 何も知らせないまま次のステップの exit 1 へ落ちてしまう（原因不明の赤に戻る）。
          # 単独の代入文にしておけば、git が失敗した時点でこのステップが止まる。
          # 名前に改行を含むファイルも git が \n の 2 文字へ変換するため 1 件 1 行になる。
          untracked_total="$(git ls-files --others --exclude-standard -- "$snapshot_dir" | wc -l)"
          # tr -cd '\0' は NULL 文字だけを残す指定。その byte 数が PNG の件数になる
          new_png_count="$(tr -cd '\0' < "$new_snapshots" | wc -c)"
          skipped_count=$(( untracked_total - new_png_count ))
          # 対象外が 1 件でもあれば、その事実を残す。何も言わずに次のステップの exit 1 へ
          # 落ちると「なぜ自動コミットされないのか」がログから読み取れず、再実行しても
          # 赤のまま原因不明になる。原因は主に 2 つ（中断した実行が残した一時ファイル／
          # PNG 以外のスナップショットを使い始めた）で、取るべき対応は正反対
          # （前者は無視・後者は SNAPSHOT_DIR と pathspec の見直し）。ログからは
          # 区別できないので、対処は指示せず、件数と一覧という判断材料だけを渡す。
          # ファイル名はアノテーションに差し込まず、ファイルへ書き出してアーティファクトで渡す。
          # ログへ差し込むと、名前に含まれる :: や ##[ が GitHub のログコマンド記法として
          # 解釈され、偽のコマンドを注入できる（どちらの記法も行頭の空白を無視したり
          # 行の途中でも拾ったりするため、前置きを足す程度では防げない）。無害化を書けば
          # update-portfolio-data.yml の escape_annotation と同じ規則の写しが増える。
          # ファイルの中身はログコマンドとして解釈されないので、この形なら無害化が要らない。
          # 手元の git status では分からない点に注意する。これらは CI の作業領域にだけ
          # 存在するファイルで、ローカルには無い（だから一覧を持ち帰れるようにする）。
          # -c core.quotePath=false は非 ASCII 名を 8 進エスケープでなくそのまま出す指定
          if [ "$skipped_count" -gt 0 ]; then
            # 書き出すのはディレクトリ内の未追跡ファイル全部（コミットする PNG も含む）。
            # PNG だけを除いた一覧にするには裏返しの pathspec が要り、上の pathspec と
            # 常に正確な補集合であり続ける必要が出る。全部を出せば参照する pathspec は
            # 1 つのままで、読む側は拡張子で見分けられる。
            git -c core.quotePath=false ls-files --others --exclude-standard \
              -- "$snapshot_dir" > "$UNTRACKED_LIST_FILE"
            echo "::warning::${snapshot_dir} に PNG 以外の未追跡ファイルが ${skipped_count} 件あります（自動コミットの対象外）。同ディレクトリの未追跡ファイル一覧（コミットする PNG も含む）はアーティファクト playwright-snapshots の ${UNTRACKED_LIST_FILE} を参照してください（CI の作業領域にだけ存在するため手元の git status には出ません）。"
          fi
          # 新規スナップショットが 1 件以上あるときだけコミットする。
          # 判定には上で数えた件数をそのまま使う（ファイルの空判定 -s と二重に持たない）
          if [ "$new_png_count" -gt 0 ]; then
            # bot として git の作者情報を設定する
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # 新規スナップショット（未追跡ファイル）だけをステージする。
            # git add e2e/... で全体を add すると既存の差分（リグレッション）も混入するため
            # 列挙された個別ファイルだけを add する。
            # 一覧は git に直接読ませる（xargs 経由だと引数長の上限で git add が複数回に
            # 分割され、途中で失敗したとき一部だけステージされた状態になる）。
            # --literal-pathspecs は「一覧の各行をパターンでなく、そのままのファイル名として扱う」指定。
            # --pathspec-file-nul が無効にするのは引用符や空白での区切り方だけで、
            # * ? [ ] といったパターン記号としての意味は残る。たとえば新規ファイルが
            # "hero[1]-linux.png" だと [1] が「1 という文字のどれか」と解釈され、
            # すでに追跡されている hero1-linux.png（＝実際のリグレッション差分を抱えた既存
            # ベースライン）まで一致してステージされてしまう。それでは上の
            # 「既存の差分を混入させない」という前提が崩れるため、パターン解釈を止める。
            # なお上の git ls-files 側は *.png というパターンで絞る必要があるので付けない
            # （付けるとその行の * も文字どおりの記号として扱われ、1 件も一致しなくなる）。
            git --literal-pathspecs add --pathspec-from-file="$new_snapshots" --pathspec-file-nul
            git commit -m "chore(e2e): Playwright ベースラインスナップショットを自動生成"
            # push 失敗はサイレントに通過させない（|| exit 1 で CI を即時失敗させる）
            git push || exit 1
            # 次のステップで「自動コミットした」と判定するために出力する
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ベースライン追加後にテストを再実行して確認
        # 自動コミットが起きたときだけ走る。
        # 「今回の失敗はベースラインが無かったせいだけだった」ことを、テストの結果
        # そのもので確かめるステップ。欠けていたベースラインが埋まっただけなら通る。
        #
        # ワークツリーの状態（git diff）を見る判定では代用できない。Playwright は
        # 既存ベースラインとの不一致時、差分画像を test-results/（gitignore 対象）へ
        # 書くだけで、追跡済みのベースラインは書き換えないため（書き換えるのは
        # --update-snapshots を changed / all で走らせたときだけで、既定は missing）。
        # つまり差分は常に空に見え、その手の判定は素通りする。
        #
        # npm run test:e2e は e2e/ 配下すべて（スナップショットを使わない
        # sections.spec.ts の機能テストを含む）を走らせるので、ベースラインが 1 枚
        # 欠けているだけでそれらの失敗まで見逃す、という取りこぼしも同時に塞げる。
        #
        # 判定をシェルの中でなく独立したステップの成否に持たせているのは、
        # Actions の画面でログを開かずに結果が見えるようにするため。
        #
        # 代償が 2 つある。
        # (1) 自動コミットが起きた実行に限り e2e が 2 回走る（時間が延びる）。
        # (2) 最終判定がこの再実行の結果だけで決まるため、1 回目の失敗が
        #     打ち消されうる。playwright.config.ts は CI で retries: 2（＝3 回試行）
        #     なので、1 回目に 3 回とも落ちたテストが再実行で通れば、そのテストは
        #     赤にならない。逆に 1 回目で通ったテストが再実行で 3 回とも落ちれば
        #     赤になる（1 回目の結果は引き継がれない）。つまり「6 回中 1 度通れば
        #     合格」ではなく、「合否は再実行の 3 回だけで決まる」。
        #     フレークしたテストの結果が入れ替わりうるという意味で、既に retries で
        #     「3 回に 1 度通れば合格」としている方針の延長であり、
        #     ベースラインが生成された実行（新しいスクショを足した PR）でしか
        #     起きないため許容している。ここを厳しくするなら、1 回目の失敗が
        #     すべて「ベースライン欠落」だったことを別途確かめる必要がある。
        id: playwright-recheck
        if: steps.autocommit.outputs.committed == 'true'
        # --output で出力先を分ける。Playwright は実行のたびに出力先ディレクトリを
        # 丸ごと消してから始めるため、既定の test-results/ のまま 2 回目を走らせると
        # 1 回目の trace やスクリーンショットが消え、失敗した実行の証拠が
        # アーティファクトに残らなくなる（このディレクトリは下の upload 対象）。
        run: |
          # 未定義変数・コマンド失敗・パイプ失敗を即時エラーとして検出する
          set -euo pipefail
          # ベースラインを足した状態で e2e をもう一度走らせる。
          # --output で出力先を分け、1 回目の test-results/ を上書きさせない。
          # ${VAR:?} は「未定義または空なら、そこで打ち切る」書き方。
          # set -u だけだと「定義されているが空」を素通しし、--output= が渡って
          # Playwright に「指定なし」と解釈されてしまうため、: を付けて空も弾く
          npm run test:e2e -- --output="${RECHECK_OUTPUT_DIR:?}"
        # ここで落ちてもジョブは止めない。このステップは失敗扱いのまま次へ進み、
        # 最終判定（赤にするかどうか）は次のステップが行う
        continue-on-error: true

      - name: ビジュアルリグレッション失敗を伝播（自動生成以外の失敗のみ）
        # 通してよいのは「自動コミットが起きて、かつ再実行が通った」ときだけ。
        # 再実行が通った＝今回の失敗はベースラインの欠落だけが原因だったということ。
        # ただし確認できるのは「そのベースラインが再現する」ことまでで、
        # 「その見た目が正しい」かどうかは人のレビューでしか分からない。
        # 注意: 自動コミットの push は secrets.GITHUB_TOKEN で行うため、GitHub の仕様により
        # 新しいワークフロー実行はトリガーされない（同リポジトリの
        # update-portfolio-data.yml も同じ事実を前提にしている）。
        # もう 1 つの帰結として、push 後の先端コミットにはチェック結果が 1 件も付かない。
        # 必須チェックを見て取り込みを決める仕組みは、この先端を「まだ通っていない」と扱う。
        # 日次データ更新 PR がこれに当たった場合にどう扱われるかは
        # update-portfolio-data.yml 側の判断なので、ここでは方針を書き写さない
        # （書き写すと片方だけ変わったときに、こちらの記述だけが古くなる）。
        if: >
          steps.playwright.outcome == 'failure' &&
          (steps.autocommit.outputs.committed != 'true' ||
           steps.playwright-recheck.outcome == 'failure')
        # 失敗の中身は上の Playwright 実行ステップのログに出ているので、ここでは
        # 原因を断定しない（断定すると、実際は別の原因だったときに誤った案内になる）。
        # 再実行ステップは自動コミットが起きなかったときは skip され、ログを持たない。
        # 名指しすると存在しないログへ誘導することになるため「上の Playwright の
        # 実行ステップ」とだけ書く。
        run: |
          echo "::error::ビジュアルリグレッションテストが失敗しました。上の Playwright の実行ステップのログを確認してください。"
          exit 1

      # CI が見たスナップショットまわりの成果物を、人が確認できるよう持ち出す。
      # 何が入るかは下の path: がそのまま答えなので、ここでは列挙しない
      # （実行モードによって存在するものが変わり、散文で書くと必ず実態とずれる）。
      # if: always() にしているのは、リグレッションで赤くなった実行でも
      # 差分画像を取り出せるようにするため。前のステップが exit 1 でジョブを
      # 失敗させるので、既定の success() のままだとこのステップが skip され、
      # 差分画像がいちばん必要な場面で何も残らない。
      # 代償が 2 つ: 失敗していない実行でもアーティファクトが毎回作られること、
      # always() はジョブのキャンセルも無視するのでキャンセル後もここが走ること。
      # 絞り込みは別途検討する。!cancelled() で消えるのは後者だけ（成功時も真になる）。
      # 前者まで消すなら failure() 側に寄せる必要がある。
      # if-no-files-found: ignore は、どの path も一致しなかった実行で
      # アノテーションを出さないための指定（外すと既定の warn になる）。
      # 追跡済みのベースラインがあるので、checkout さえ済んでいれば通常は一致する。
      # 効くのは checkout 前に落ちた実行（always() なのでここは走る）。
      - name: スナップショット関連ファイルをアーティファクトに保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-snapshots
          # test-results/ は 1 回目の出力先で、playwright.config.ts が outputDir を
          # 指定していないときの既定値。こちらでは決めていないので、あちらで
          # outputDir を設定したらここも併せて直す
          # （一致しないと失敗の証跡が黙って空になる）。
          # env 参照に末尾の / を付けないのは、名前を間違えたときの被害を抑えるため。
          # ${{ env.X }} は未定義でも空文字になるだけで、actionlint も検出しない
          # （実際に別名へ変えて確認した）。"…/" と書いていると空展開で path が "/" になり、
          # ランナーのルート全体をアップロードしようとする。末尾を付けなければ
          # 空行になって無視されるだけで済む。ディレクトリは / 無しでも指定できる。
          path: |
            e2e/**/*.png
            test-results/
            ${{ env.RECHECK_OUTPUT_DIR }}
            ${{ env.UNTRACKED_LIST_FILE }}
          retention-days: 7
          if-no-files-found: ignore
