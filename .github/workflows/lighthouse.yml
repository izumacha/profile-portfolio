name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [main]
  # CI ワークフロー側と同じ理由で手動実行を許す。ベースライン自動コミット後の
  # HEAD にはどのワークフローもチェックを付けないため、必須ステータスチェックに
  # このジョブが含まれている場合はここからも走らせ直せるようにしておく。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHA for supply-chain integrity (issue #16).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 版は `.nvmrc`（唯一の正本）から読む（どの major を選ぶかの理由は ci.yml の
      # html-validate ジョブのコメント。同じ package-lock.json を入れるので major を割らない）
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # 依存はロックファイルで固定済みなので、~/.npm を再利用して毎回の
          # フル取得を避ける（この PR で html-validate ジョブにも npm ci が入り、
          # lint 1 本のために dev 依存一式を毎回落としていた）
          cache: npm

      - name: Install
        # Use the reproducible, lockfile-driven install (issue #16); the repo
        # ships package-lock.json, so npm ci is deterministic vs. npm install.
        run: npm ci

      - name: Run Lighthouse CI
        run: npm run test:lighthouse
