name: Update Playwright Snapshots

# Regenerates the visual-regression baselines inside the CI environment and
# commits them back to the triggering branch. Run this from the Actions tab
# (or via the API) whenever the layout changes and the snapshots need to be
# refreshed. Baselines are platform-specific, so they must be generated on the
# same Linux runner the `visual-regression` job uses.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHA for supply-chain integrity (issue #16).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 版は `.nvmrc`（唯一の正本）から読む（どの major を選ぶかの理由は ci.yml の
      # html-validate ジョブのコメント。同じ package-lock.json を入れるので major を割らない）
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # 依存はロックファイルで固定済みなので、~/.npm を再利用して毎回の
          # フル取得を避ける（この PR で html-validate ジョブにも npm ci が入り、
          # lint 1 本のために dev 依存一式を毎回落としていた）
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Update snapshots
        run: npx playwright test --update-snapshots

      - name: Commit updated snapshots
        # ブランチ名は ${{ }} で run: へ直接埋め込まず、env 経由で渡して "$REF" と引用する。
        # ${{ }} はシェルに渡る前にテキストとして展開されるため、埋め込むとブランチ名が
        # そのままシェルの一部になる。git はブランチ名に空白と ~^:?*[\ を禁じているが
        # `;` `&` `|` `$( )` バッククォートは許すので、`foo;id` のような名前を
        # 作れる人は、contents: write を持つこのジョブで任意のコマンドを実行できる
        # （§9 外部由来の値を文字列連結でシェルに渡さない）。
        env:
          # チェックアウトしているブランチ名。シェルには環境変数としてだけ渡す
          REF: ${{ github.ref_name }}
        run: |
          if [[ -n "$(git status --porcelain e2e)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add e2e
            git commit -m "chore: update Playwright visual snapshots"
            git push origin "HEAD:$REF"
          else
            echo "No snapshot changes to commit."
          fi
